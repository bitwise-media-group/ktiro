<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ktiro</title>
    <meta name="description" content="ktiro: an intent-driven software factory (prototype, demo data only)." />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cg fill='none' stroke='%237a8794' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M5 3.5v17M5 12l7.5-5.5M5 12l7.5 5.5M12.5 6.5 19 12M12.5 17.5 19 12'/%3E%3C/g%3E%3Ccircle cx='12.5' cy='6.5' r='2.3' fill='%237a8794'/%3E%3Ccircle cx='12.5' cy='17.5' r='2.3' fill='%237a8794'/%3E%3Ccircle cx='19' cy='12' r='3.4' fill='%232f7fd0'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400..700&family=Atkinson+Hyperlegible+Next:ital,wght@0,400..700;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="theme-ktiro">
    <script>
      // Pre-paint theme restore. With no stored choice, the operating system's
      // preference decides.
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem("ktiro-theme");
        } catch (e) {}
        var light =
          stored === "light" ||
          (stored === null && window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches);
        if (light) document.body.classList.replace("theme-ktiro", "theme-ktiro-light");
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

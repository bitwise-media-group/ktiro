config:
    # House prose wraps at 120 columns.
    MD013:
        line_length: 120
        code_blocks: false
        tables: false
    MD033: false
globs:
    - "**/*.md"

ignores:
    - "node_modules/**"
    - "dist/**"
    - ".claude/**"
    - ".mise/**"

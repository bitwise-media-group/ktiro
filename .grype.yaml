# Triage for the lint-docker grype gate (.mise/common/scripts/lint-docker.sh),
# which scans the external base images named in the Dockerfile's FROM lines.
#
# Each rule is pinned to the vulnerable package version, so a rebuilt image
# that still carries it elsewhere, or a reintroduction, fails the gate again.
ignore:
  # oven/bun:1.4.5-slim, the BUILD stage only (FROM --platform=$BUILDPLATFORM
  # ... AS build). Nothing from it ships: the runtime image copies only the
  # compiled server, which links the distroless runtime's own glibc, and the
  # built HTML page. gcr.io/distroless/cc-debian13 (the runtime) scans clean.
  # Fixed in Debian (2.41-12+deb13u5, zlib 1:1.3.dfsg+really1.3.1-1+deb13u1);
  # delete these once oven/bun publishes a rebuild carrying them.
  - vulnerability: CVE-2026-19499
    package: { name: libc6, version: 2.41-12+deb13u4 }
  - vulnerability: CVE-2026-19499
    package: { name: libc-bin, version: 2.41-12+deb13u4 }
  - vulnerability: CVE-2026-5435
    package: { name: libc6, version: 2.41-12+deb13u4 }
  - vulnerability: CVE-2026-5435
    package: { name: libc-bin, version: 2.41-12+deb13u4 }
  - vulnerability: CVE-2026-85091
    package: { name: zlib1g, version: 1:1.3.dfsg+really1.3.1-1+b1 }
